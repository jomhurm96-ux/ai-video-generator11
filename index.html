<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Generator Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 max-w-5xl mx-auto flex flex-col gap-6">

  <!-- Header -->
  <header class="border-b border-gray-800 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">
        AI Video Studio
      </h1>
      <p class="text-xs md:text-sm text-gray-400 mt-0.5">
        Powered by Replicate AI (Real Video Generation)
      </p>
    </div>
    
    <!-- API Key Input in Header -->
    <div class="flex items-center gap-2 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-xl">
      <i data-lucide="key" class="w-4 h-4 text-amber-400"></i>
      <input type="password" id="api-key" placeholder="Replicate API Token (r8_...)" class="bg-transparent text-xs text-white focus:outline-none w-48 md:w-56 placeholder-gray-500" />
    </div>
  </header>

  <!-- Main Grid -->
  <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
    
    <!-- Controls (Left 7 Cols) -->
    <div class="md:col-span-7 bg-gray-900/80 border border-gray-800 p-5 rounded-2xl flex flex-col gap-4">
      
      <!-- Mode Selection Tabs -->
      <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 text-sm font-medium">
        <button id="tab-text" onclick="switchMode('text')" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white transition flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4"></i> Text → Video
        </button>
        <button id="tab-image" onclick="switchMode('image')" class="flex-1 py-2 rounded-lg text-gray-400 hover:text-white transition flex items-center justify-center gap-2">
          <i data-lucide="image" class="w-4 h-4"></i> Image → Video
        </button>
      </div>

      <!-- Prompt Input -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-gray-400 uppercase">Prompt (ဖော်ပြချက်ကို အင်္ဂလိပ်လို ရေးလျှင် AI က ပိုနားလည်ပါသည်)</label>
        <textarea id="prompt-input" rows="3" placeholder="e.g. A futuristic cyberpunk city at night with flying cars, neon lights, 4k cinematic" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <!-- AI Video Model Selection -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-gray-400 uppercase">AI Video Model</label>
        <select id="model-select" class="bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-gray-200 focus:border-indigo-500">
          <option value="minimax">MiniMax Video-01 (အရည်အသွေးမြင့် Text-to-Video)</option>
          <option value="zeroscope">Zeroscope V2 (ပေါ့ပါးမြန်ဆန်သော Model)</option>
        </select>
      </div>

      <!-- Settings Dropdowns -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">Duration</label>
          <select id="duration-select" class="bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs">
            <option value="5s">5 Seconds</option>
            <option value="10s">10 Seconds</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">Aspect Ratio</label>
          <select id="ratio-select" class="bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs">
            <option value="16:9">16:9 (Landscape)</option>
            <option value="9:16">9:16 (Vertical)</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">AI Voice</label>
          <select id="voice-select" class="bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs">
            <option value="my">မြန်မာ (Burmese)</option>
            <option value="en">English (US)</option>
          </select>
        </div>
      </div>

      <!-- Generate Button -->
      <button id="generate-btn" onclick="startGeneration()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 font-semibold rounded-xl text-white transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
        <i data-lucide="play" class="w-4 h-4 fill-white"></i> Generate Real AI Video
      </button>

    </div>

    <!-- Video Output (Right 5 Cols) -->
    <div class="md:col-span-5 bg-gray-900/80 border border-gray-800 p-5 rounded-2xl min-h-[460px] flex flex-col justify-between">
      <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Video Output</h2>

      <!-- Placeholder -->
      <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-center p-6 text-gray-600 gap-2">
        <i data-lucide="video" class="w-12 h-12 stroke-[1.5]"></i>
        <p class="text-sm">API Token နှင့် Prompt ထည့်ပြီး Generate ကို နှိပ်ပါ</p>
      </div>

      <!-- Loading / Progress -->
      <div id="loading-state" class="hidden flex-1 flex flex-col items-center justify-center p-6 gap-3">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-500"></div>
        <p id="status-label" class="text-xs text-indigo-300 text-center mt-2">AI server သို့ ပို့ဆောင်နေပါသည်...</p>
      </div>

      <!-- Result Video -->
      <div id="result-state" class="hidden flex-1 flex flex-col gap-3 my-auto">
        <video id="output-video" controls class="w-full rounded-xl border border-gray-800 bg-black"></video>
        <a id="download-btn" href="#" target="_blank" download="ai_video.mp4" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition">
          <i data-lucide="download" class="w-4 h-4"></i> Download Video
        </a>
      </div>

      <div class="text-[11px] text-gray-500 text-center border-t border-gray-800/60 pt-3">
        Replicate API Integration Active
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // Auto-load saved token from LocalStorage
    const savedToken = localStorage.getItem('replicate_token');
    if (savedToken) document.getElementById('api-key').value = savedToken;

    document.getElementById('api-key').addEventListener('input', (e) => {
      localStorage.setItem('replicate_token', e.target.value.trim());
    });

    async function startGeneration() {
      const token = document.getElementById('api-key').value.trim();
      const prompt = document.getElementById('prompt-input').value.trim();

      if (!token) {
        alert("ကျေးဇူးပြု၍ ညာဘက်အပေါ်က အကွက်မှာ Replicate API Token ထည့်ပေးပါ!");
        return;
      }
      if (!prompt) {
        alert("ကျေးဇူးပြု၍ Prompt ရေးပေးပါ!");
        return;
      }

      const emptyState = document.getElementById('empty-state');
      const loadingState = document.getElementById('loading-state');
      const resultState = document.getElementById('result-state');
      const statusLabel = document.getElementById('status-label');
      const outputVideo = document.getElementById('output-video');
      const downloadBtn = document.getElementById('download-btn');
      const generateBtn = document.getElementById('generate-btn');

      emptyState.classList.add('hidden');
      resultState.classList.add('hidden');
      loadingState.classList.remove('hidden');
      generateBtn.disabled = true;

      try {
        statusLabel.innerText = "Replicate AI သို့ တောင်းဆိုနေပါသည်...";

        // Start Prediction using Replicate API (MiniMax Video Model)
        const response = await fetch("https://api.replicate.com/v1/models/minimax/video-01/predictions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json",
            "Prefer": "wait"
          },
          body: JSON.stringify({
            input: {
              prompt: prompt,
              prompt_optimizer: true
            }
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        // Check if finished or polling needed
        let prediction = data;
        while (prediction.status !== "succeeded" && prediction.status !== "failed" && prediction.status !== "canceled") {
          statusLabel.innerText = `AI Video ထုတ်လုပ်နေပါသည်... (အခြေအနေ: ${prediction.status})`;
          await new Promise(r => setTimeout(r, 4000));
          const pollRes = await fetch(`https://api.replicate.com/v1/predictions/${prediction.id}`, {
            headers: { "Authorization": `Bearer ${token}` }
          });
          prediction = await pollRes.json();
        }

        if (prediction.status === "succeeded") {
          const videoUrl = Array.isArray(prediction.output) ? prediction.output[0] : prediction.output;
          outputVideo.src = videoUrl;
          downloadBtn.href = videoUrl;
          loadingState.classList.add('hidden');
          resultState.classList.remove('hidden');
        } else {
          throw new Error("Generation မအောင်မြင်ပါ- " + (prediction.error || "ကျေးဇူးပြု၍ ပြန်စမ်းကြည့်ပါ"));
        }

      } catch (err) {
        alert("Error: " + err.message);
        loadingState.classList.add('hidden');
        emptyState.classList.remove('hidden');
      } finally {
        generateBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
