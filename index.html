<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Generator Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 max-w-5xl mx-auto flex flex-col gap-6">

  <!-- Header -->
  <header class="border-b border-gray-800 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">
        AI Video Studio
      </h1>
      <p class="text-xs md:text-sm text-gray-400 mt-0.5">
        AI Video + Multi-language Voiceover + BGM Music Player
      </p>
    </div>
    
    <!-- API Token Input -->
    <div class="flex items-center gap-2 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-xl shadow-inner">
      <i data-lucide="key" class="w-4 h-4 text-amber-400"></i>
      <input type="password" id="api-key" placeholder="Replicate Token (r8_...)" class="bg-transparent text-xs text-white focus:outline-none w-48 md:w-56 placeholder-gray-500" />
    </div>
  </header>

  <!-- Main Grid -->
  <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
    
    <!-- Controls (Left 7 Cols) -->
    <div class="md:col-span-7 bg-gray-900/80 border border-gray-800 p-5 rounded-2xl flex flex-col gap-4 shadow-xl">
      
      <!-- Mode Selection Tabs -->
      <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 text-sm font-medium">
        <button id="tab-text" onclick="switchMode('text')" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white transition flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4"></i> Text → Video
        </button>
        <button id="tab-image" onclick="switchMode('image')" class="flex-1 py-2 rounded-lg text-gray-400 hover:text-white transition flex items-center justify-center gap-2">
          <i data-lucide="image" class="w-4 h-4"></i> Image → Video
        </button>
      </div>

      <!-- Prompt Input (Video Action) -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-gray-400 uppercase">
          Video Visual Prompt (AI လှုပ်ရှားမှုအတွက် အင်္ဂလိပ်လို ရေးပါ)
        </label>
        <textarea id="prompt-input" rows="2" placeholder="e.g. Cinematic motion, a cute red apple smiling and dancing happily on a table, 3d render" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <!-- Voiceover / Narration Input -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-gray-400 uppercase flex items-center gap-1">
          <i data-lucide="mic" class="w-3.5 h-3.5 text-indigo-400"></i> Voiceover Script (အသံထွက်ဖတ်မည့် စာသား)
        </label>
        <textarea id="voice-script" rows="2" placeholder="ဥပမာ- ရှေးရှေးတုန်းက သစ်သီးဆိုင်လေးထဲမှာ ပျော်ရွှင်စရာ ပန်းသီးလေးတစ်လုံး ရှိပါသတဲ့..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <!-- Character Consistency -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-gray-400 uppercase flex items-center gap-1">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 text-indigo-400"></i> Character ID / Consistency Ref
        </label>
        <input type="text" id="character-input" placeholder="e.g. #apple_character, big cartoon eyes, red glossy texture" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500" />
      </div>

      <!-- Model Selection -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-gray-400 uppercase">AI Video Model</label>
        <select id="model-select" class="bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-gray-200 focus:border-indigo-500">
          <option value="minimax/video-01">MiniMax Video-01 (Text-to-Video)</option>
          <option value="lucataco/animate-diff">AnimateDiff (Fast Video)</option>
        </select>
      </div>

      <!-- Settings Dropdowns -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">Duration</label>
          <select id="duration-select" class="bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs">
            <option value="5s">5 Seconds</option>
            <option value="10s">10 Seconds</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">Aspect Ratio</label>
          <select id="ratio-select" class="bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs">
            <option value="16:9">16:9 (Landscape)</option>
            <option value="9:16">9:16 (Vertical)</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">AI Voice</label>
          <select id="voice-select" class="bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs">
            <option value="my-MM">မြန်မာ (Burmese)</option>
            <option value="th-TH">ภาษาไทย (Thai)</option>
            <option value="en-US">English (US)</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">BGM Music</label>
          <select id="music-select" class="bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs">
            <option value="cinematic">Cinematic</option>
            <option value="horror">Suspense/Horror</option>
            <option value="epic">Epic Action</option>
            <option value="none">No Music</option>
          </select>
        </div>
      </div>

      <!-- Generate Button -->
      <button id="generate-btn" onclick="startGeneration()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 font-semibold rounded-xl text-white transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
        <i data-lucide="play" class="w-4 h-4 fill-white"></i> Generate AI Video with Audio
      </button>

    </div>

    <!-- Video Output (Right 5 Cols) -->
    <div class="md:col-span-5 bg-gray-900/80 border border-gray-800 p-5 rounded-2xl min-h-[460px] flex flex-col justify-between shadow-xl">
      <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center justify-between">
        <span>Video Output</span>
        <span id="audio-indicator" class="hidden text-[10px] text-emerald-400 bg-emerald-950/60 border border-emerald-800/80 px-2 py-0.5 rounded-md flex items-center gap-1">
          <i data-lucide="volume-2" class="w-3 h-3"></i> Audio Synced
        </span>
      </h2>

      <!-- Empty State -->
      <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-center p-6 text-gray-600 gap-2">
        <i data-lucide="video" class="w-12 h-12 stroke-[1.5]"></i>
        <p class="text-sm">API Token နှင့် Prompt ထည့်ပြီး Generate ကို နှိပ်ပါ</p>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="hidden flex-1 flex flex-col items-center justify-center p-6 gap-3">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-500"></div>
        <p id="status-label" class="text-xs text-indigo-300 text-center mt-2">AI server သို့ ဆက်သွယ်နေပါသည်...</p>
      </div>

      <!-- Result Video State -->
      <div id="result-state" class="hidden flex-1 flex flex-col gap-3 my-auto">
        <video id="output-video" controls loop class="w-full rounded-xl border border-gray-800 bg-black"></video>
        
        <!-- Background Audio (Hidden) -->
        <audio id="bgm-player" loop></audio>

        <a id="download-btn" href="#" target="_blank" download="ai_video.mp4" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition">
          <i data-lucide="download" class="w-4 h-4"></i> Download Video
        </a>
      </div>

      <div class="text-[11px] text-gray-500 text-center border-t border-gray-800/60 pt-3">
        Audio Engine Active (Speech Synthesis + BGM Sync)
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();
    let currentMode = 'text';

    // BGM Tracks (Royalty Free)
    const BGM_TRACKS = {
      cinematic: "https://actions.google.com/sounds/v1/weather/rain_heavy.ogg",
      horror: "https://actions.google.com/sounds/v1/horror/ambient_hum.ogg",
      epic: "https://actions.google.com/sounds/v1/sports/crowd_cheer.ogg",
      none: ""
    };

    // Auto-save Token
    const savedToken = localStorage.getItem('replicate_token');
    if (savedToken) document.getElementById('api-key').value = savedToken;
    document.getElementById('api-key').addEventListener('input', (e) => {
      localStorage.setItem('replicate_token', e.target.value.trim());
    });

    function switchMode(m) {}

    // Audio Playback Synchronization
    function setupAudioPlayback(scriptText, lang, bgmType) {
      const video = document.getElementById('output-video');
      const bgm = document.getElementById('bgm-player');
      const indicator = document.getElementById('audio-indicator');
      indicator.classList.remove('hidden');

      if (BGM_TRACKS[bgmType]) {
        bgm.src = BGM_TRACKS[bgmType];
        bgm.volume = 0.25; // Soft BGM
      } else {
        bgm.removeAttribute('src');
      }

      const speak = () => {
        if (!scriptText || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); // Reset previous
        const utterance = new SpeechSynthesisUtterance(scriptText);
        utterance.lang = lang;
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      };

      video.onplay = () => {
        if (bgm.src) bgm.play();
        speak();
      };

      video.onpause = () => {
        if (bgm.src) bgm.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.pause();
      };
    }

    async function startGeneration() {
      const token = document.getElementById('api-key').value.trim();
      let prompt = document.getElementById('prompt-input').value.trim();
      const voiceScript = document.getElementById('voice-script').value.trim();
      const charRef = document.getElementById('character-input').value.trim();
      const model = document.getElementById('model-select').value;
      const lang = document.getElementById('voice-select').value;
      const bgmType = document.getElementById('music-select').value;

      if (!token) {
        alert("ကျေးဇူးပြု၍ Replicate API Token ထည့်ပေးပါ!");
        return;
      }
      if (!prompt) {
        alert("ကျေးဇူးပြု၍ Video Prompt ရေးပေးပါ!");
        return;
      }

      // လှုပ်ရှားမှု မသေစေရန် Motion Keywords များ အလိုအလျောက် ပေါင်းထည့်ပေးခြင်း
      let enhancedPrompt = `cinematic video, fluid movement, dynamic motion, ${prompt}`;
      if (charRef) {
        enhancedPrompt += `, Consistent Character: (${charRef})`;
      }

      const emptyState = document.getElementById('empty-state');
      const loadingState = document.getElementById('loading-state');
      const resultState = document.getElementById('result-state');
      const statusLabel = document.getElementById('status-label');
      const outputVideo = document.getElementById('output-video');
      const downloadBtn = document.getElementById('download-btn');
      const generateBtn = document.getElementById('generate-btn');

      emptyState.classList.add('hidden');
      resultState.classList.add('hidden');
      loadingState.classList.remove('hidden');
      generateBtn.disabled = true;

      try {
        statusLabel.innerText = "AI Server သို့ ချိတ်ဆက်နေပါသည်...";

        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: enhancedPrompt, token, model })
        });

        const data = await response.json();

        if (data.error || data.detail) {
          throw new Error(data.error || data.detail);
        }

        let prediction = data;
        while (prediction.status !== "succeeded" && prediction.status !== "failed" && prediction.status !== "canceled") {
          statusLabel.innerText = `AI Video ဖန်တီးနေပါသည်... (${prediction.status})`;
          await new Promise(r => setTimeout(r, 4000));
          
          const pollRes = await fetch(`/api/status?id=${prediction.id}&token=${token}`);
          prediction = await pollRes.json();
        }

        if (prediction.status === "succeeded") {
          const videoUrl = Array.isArray(prediction.output) ? prediction.output[0] : prediction.output;
          outputVideo.src = videoUrl;
          downloadBtn.href = videoUrl;

          // ဗီဒီယိုနှင့် Voice/BGM ချိတ်ဆက်ခြင်း
          setupAudioPlayback(voiceScript || prompt, lang, bgmType);

          loadingState.classList.add('hidden');
          resultState.classList.remove('hidden');
        } else {
          throw new Error("Generation မအောင်မြင်ပါ- " + (prediction.error || "ကျေးဇူးပြု၍ ပြန်စမ်းပါ"));
        }

      } catch (err) {
        alert("Error: " + err.message);
        loadingState.classList.add('hidden');
        emptyState.classList.remove('hidden');
      } finally {
        generateBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
